spring.application.name=CineTicket

# Database - uses environment variables in production, local values as fallback
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cineticket}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:Mritunjay@123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:c7f3a9b2e4d6f8a1c3e5b7d9f2a4c6e8b0d2f4a6c8e0b2d4f6a8c0e2b4d6f8a0c7f3a9b2e4d6f8a1c3e5b7d9f2a4c6e8b0d2f4a6c8e0b2d4f6a8c0e2b4d6f8a0}
jwt.expiry.minutes=600

# Server port - Railway injects PORT variable
server.port=${PORT:8080}

